- type: entity
  parent: ClothingNeckBase # maybe remove basetoggle if it's causing issues
  id: ClothingNeckPhantomCloak
  name: phantom cloaking unit
  description: Now they see you- now, they're dead.
  components:
  - type: Sprite
    sprite: _Damnation/Clothing/Neck/Cloaks/phantomcloak.rsi
  - type: Clothing
    sprite: _Damnation/Clothing/Neck/Cloaks/phantomcloak.rsi
  - type: ItemToggle
  - type: ToggleClothing
    action: ActionTogglePhantomCloak
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      hadOutline: true
    - type: StealthOnMove
      passiveVisibilityRate: -0.37
      movementVisibilityRate: 0.20 # adjacent to stealth box, but no silent footsteps
  - type: PowerCellDraw
    drawRate: 4
  - type: ToggleCellDraw
  - type: ExaminableBattery
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium # Aurora: Start with a short burst, work your way up
        disableEject: false
        swap: true
        whitelist: # Aurora: Disallow micros. Power draw 4 only draws 4 power per second: Micros recharge more than this.
          tags:
          - PowerCellSmall
          - PowerCellMedium
          - PowerCellHigh
          - PowerCellHyper
        blacklist:
          tags:
          - PowerCellAntique
          - PowerCellFusion
