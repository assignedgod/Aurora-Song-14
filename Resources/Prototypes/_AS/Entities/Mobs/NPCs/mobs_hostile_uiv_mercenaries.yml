
- type: entity
  name: explorer
  parent:
  - MobMovementSpeedModifierRanged
  - MobMercenaryBase
  - MobHumanoidHostileAISimpleRanged
  id: MobMercExplorerRangedT3
  description: Veteran scrappers, these salvagers are wealthy enough to explore abandoned ruins for the adrenaline rush and adventure alone.
  categories: [ HideSpawnMenu ]
  components:
  - type: Loadout
    prototypes:
    - MobHumanoidExplorerGearRangedT3
  - type: Damageable
    damageModifierSet: MobHostileDamageModifierSetHigh
  - type: Sprite
    drawdepth: Mobs
    layers:
    # Helmet
    - sprite: Clothing/Head/Hardsuits/luxury.rsi
      state: off-equipped-HELMET
    - sprite: Clothing/Head/Hardsuits/spatiohelm.rsi
      state: equipped-head-light
      shader: unshaded
      color: "#47f8ff"
    # Suit
    - sprite: Clothing/OuterClothing/Hardsuits/luxury.rsi
      state: equipped-OUTERCLOTHING
    # Weapons
    - sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
      state: wielded-inhand-right
    # Fluff
    - sprite: Objects/Tools/lantern.rsi
      state: on-equipped-BELT
      shader: unshaded
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: NFBulletKineticMediumPower
    capacity: 1
    count: 1
  - type: Gun
    showExamineText: false
    fireRate: 0.75
    minAngle: 10
    maxAngle: 20
    angleIncrease: 2
    angleDecay: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: PointLight
    radius: 7
    energy: 3

- type: entity
  name: miner
  parent:
  - MobMercenaryBase
  - MobHumanoidHostileAISimpleMelee
  id: MobMercExplorerMeleeT3
  description: Drilling in the name of... drilling. No rock formation can withstand the power of dual-wielded mining drills - good thing you aren't a rock.
  categories: [ HideSpawnMenu ]
  components:
  - type: Loadout
    prototypes:
    - MobHumanoidExplorerGearMeleeT3
  - type: Damageable
    damageModifierSet: MobHostileDamageModifierSetHigh
  - type: Sprite
    drawdepth: Mobs
    layers:
    # Helmet
    - sprite: Clothing/Head/Hardsuits/salvage.rsi
      state: on-equipped-HELMET
    - sprite: Clothing/Head/Hardsuits/spatiohelm.rsi
      state: equipped-head-light
      shader: unshaded
      color: "#47f8ff"
    # Suit
    - sprite: Clothing/OuterClothing/Hardsuits/salvage.rsi
      state: equipped-OUTERCLOTHING
    # Weapons
    - sprite: Objects/Tools/handdrill.rsi
      state: inhand-right
    - sprite: Objects/Tools/handdrill.rsi
      state: inhand-left
    # Fluff
    - sprite: Objects/Tools/lantern.rsi
      state: on-equipped-BELT
      shader: unshaded
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 4
    damage:
      types:
        Blunt: 2
        Slash: 2
        Piercing: 2
        Structural: 25
  - type: PointLight
    radius: 7
    energy: 3

#Tier 4 - Bosses
- type: entity
  name: chief salvage officer
  parent:
  - MobHostileBossBase
  - MobMercenaryBase
  - MobHumanoidHostileAISimpleMelee
  id: UIVMercenaryExplorerBoss
  description: When all you have is a holopick, everything starts looking like scrap.
#  categories: [ HideSpawnMenu ]
  components:
  - type: Reflect # Emulating holopickaxe to a degree
    reflectProb: 0.05
  - type: Loadout
    prototypes:
    - MobHumanoidMercExplorerGearBoss
  - type: NpcFactionMember
    factions:
    - MercenariesExpeditionNF
  - type: Damageable
    damageModifierSet: MobHostileDamageModifierSetBoss
  - type: Sprite
    drawdepth: Mobs
    layers:
    # Helmet
    - sprite: Clothing/Head/Hardsuits/maxim.rsi
      state: equipped-HELMET
    - sprite: Clothing/Head/Hardsuits/spatiohelm.rsi
      state: equipped-head-light
      shader: unshaded
      color: "#e95151"
    # Suit
    - sprite: Clothing/OuterClothing/Hardsuits/maxim.rsi
      state: equipped-OUTERCLOTHING
    # Weapons
    - sprite: _NF/Objects/Weapons/Melee/energy_pickaxe.rsi
      state: inhand-left
    - sprite: _NF/Objects/Weapons/Melee/energy_pickaxe.rsi
      state: inhand-left-blade
      shader: unshaded
      color: "#e95151"
    # Fluff
    - sprite: Objects/Tools/lantern.rsi
      state: on-equipped-BELT
      shader: unshaded
  - type: PointLight
    radius: 7
    energy: 3
  - type: MobThresholds
    thresholds:
      150: Critical
      155: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: MeleeWeapon
    hidden: true
    attackRate: 2
    damage:
      types:
        Heat: 16
        Piercing: 5
        Structural: 40
    soundHit:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
        volume: -10
